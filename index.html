<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSDA Backlink DB</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e6e6; --mut:#8b93a1; --acc:#5aa9ff; --card:#171a21;
          --bd:#252a34; --hl:#2a3345; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
  header { padding:12px 18px; border-bottom:1px solid var(--bd); display:flex;
           align-items:center; gap:14px; flex:0 0 auto; }
  header h1 { margin:0; font-size:16px; } header h1 span { color:var(--acc); }
  header a { color:var(--acc); text-decoration:none; font-size:12px; }
  .main { flex:1; display:flex; min-height:0; }

  /* Sol: arama */
  .side { width:340px; flex:0 0 340px; border-right:1px solid var(--bd);
          display:flex; flex-direction:column; min-height:0; }
  .search { padding:12px; border-bottom:1px solid var(--bd); }
  .search .row { display:flex; gap:6px; }
  input,select,button { font:inherit; padding:8px 10px; border-radius:7px;
          border:1px solid var(--bd); background:var(--card); color:var(--fg); }
  input#q { flex:1; min-width:0; }
  button { background:var(--acc); color:#04122b; border:none; cursor:pointer; font-weight:600; }
  .hint { color:var(--mut); font-size:11px; margin-top:6px; }
  .results { overflow-y:auto; flex:1; }
  .res { padding:9px 12px; border-bottom:1px solid var(--bd); cursor:pointer; }
  .res:hover { background:var(--card); }
  .res .t { margin:0; }
  .res .m { color:var(--mut); font-size:11px; margin-top:3px; word-break:break-all; }

  /* Sağ: doküman */
  .view { flex:1; display:flex; flex-direction:column; min-height:0; }
  .bar { padding:9px 16px; border-bottom:1px solid var(--bd); display:flex;
         align-items:center; gap:10px; flex:0 0 auto; }
  .bar .path { color:var(--mut); font-size:12px; word-break:break-all; }
  .bar button { background:var(--card); color:var(--fg); border:1px solid var(--bd);
                padding:5px 10px; font-size:12px; }
  .backlinks { border-bottom:1px solid var(--bd); max-height:34%; overflow-y:auto; flex:0 0 auto; }
  .bl-head { padding:8px 16px; color:var(--mut); font-size:12px; position:sticky; top:0;
             background:var(--bg); border-bottom:1px solid var(--bd); }
  .bl { padding:7px 16px; border-bottom:1px solid var(--bd); cursor:pointer; }
  .bl:hover { background:var(--card); }
  .bl .m { color:var(--mut); font-size:11px; margin-top:2px; word-break:break-all; }
  .doc { overflow-y:auto; flex:1; padding:16px 20px; }
  .ln { white-space:pre-wrap; word-break:break-word; padding:1px 0; }
  .ln.h1 { font-size:19px; font-weight:700; margin-top:6px; }
  .ln.h2 { font-size:16px; font-weight:700; color:#cfe3ff; margin-top:4px; }
  .ln.h3 { font-size:14px; font-weight:700; color:#b9c6d8; }
  .ln.prop { color:var(--mut); font-size:12px; }
  .ln.bullet::before { content:"• "; color:var(--mut); }
  .ln.focus { background:var(--hl); border-radius:6px; }
  .badge { display:inline-block; font-size:10px; padding:0 6px; border-radius:20px;
           background:#22303f; color:var(--acc); margin-right:6px; vertical-align:1px; }
  .badge.rbl{background:#2f2436;color:#d69bff} .badge.blockref{background:#22303f;color:#5aa9ff}
  .badge.wikilink{background:#243626;color:#7ad67a} .badge.tag{background:#3a3320;color:#e6c65a}
  a.ref { cursor:pointer; text-decoration:none; border-bottom:1px dashed; }
  a.ref.block { color:#5aa9ff; } a.ref.page { color:#7ad67a; }
  a.ref.dead { color:#c96; border-bottom-style:dotted; }
  .empty { color:var(--mut); padding:24px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>OSDA <span>Backlink</span> DB</h1>
  <a id="docs-link" href="/docs">API /docs</a>
  <span id="stat" style="color:var(--mut);font-size:12px;margin-left:auto"></span>
</header>
<div class="main">
  <div class="side">
    <div class="search">
      <div class="row">
        <input id="q" placeholder="Ara: metin veya refid…" autofocus>
        <button onclick="doSearch()">Ara</button>
      </div>
      <div class="hint">Bir sonuca tıkla → dokümanı aç, linkler arası gez.</div>
    </div>
    <div id="results" class="results"><div class="empty">Aramaya başla</div></div>
  </div>

  <div class="view">
    <div class="bar">
      <button id="back" onclick="goBack()" disabled>← Geri</button>
      <span id="path" class="path">Doküman seçilmedi</span>
    </div>
    <div id="backlinks" class="backlinks" style="display:none"></div>
    <div id="doc" class="doc"><div class="empty">Soldan bir sonuç seç ya da ara.</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// osda-api altında /backlink mount ise path prefix; doğrudan 8010'da boş kalır
const BASE = location.pathname.startsWith('/backlink') ? '/backlink' : '';
let history_ = [];   // {graph,file,line,ref}
let current = null;

// Dashboard'dan #api-key=... ile gelindiyse kaydet ve URL'den temizle
(function(){
  const m = location.hash.match(/(?:^|[&#])api-key=([^&]*)/);
  if(m){
    try { localStorage.setItem('osda_api_key', decodeURIComponent(m[1])); } catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

$('docs-link').href = BASE + '/docs';

// --- yardımcılar ---
function pageKeyFromFile(graph, file) {
  let stem = file.split('/').pop().replace(/\.md$/,'');
  stem = stem.replace(/___/g,'/').replace(/^#\s*/,'').trim();
  return graph + '/' + stem;
}
function indentLevel(ws){ const t=(ws.match(/\t/g)||[]).length; return t + Math.floor((ws.length-t)/2); }

async function jget(url){
  const key = localStorage.getItem('osda_api_key') || '';
  const r = await fetch(BASE + url, {headers: key ? {'api-key': key} : {}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

// --- arama ---
async function doSearch(){
  const q = $('q').value.trim(); if(!q) return;
  $('results').innerHTML = '<div class="empty">…</div>';
  try {
    const rows = await jget('/search?q='+encodeURIComponent(q)+'&limit=50');
    const box = $('results'); box.innerHTML = '';
    if(!rows.length){ box.innerHTML='<div class="empty">sonuç yok</div>'; return; }
    for(const h of rows){
      const el = document.createElement('div'); el.className = 'res';
      el.innerHTML = `<p class="t">${esc(h.text)||'<i>(boş blok)</i>'}</p>
        <div class="m">${esc(h.graph)}/${esc(h.file)}:${h.line}</div>`;
      el.addEventListener('click', ()=>openDoc(h.graph, h.file, h.line, h.refid||null));
      box.appendChild(el);
    }
  } catch(e){ $('results').innerHTML='<div class="empty">hata: '+e+'</div>'; }
}

// --- doküman aç ---
async function openDoc(graph, file, line, ref, push){
  try {
    const d = await jget('/doc?graph='+encodeURIComponent(graph)+'&file='+encodeURIComponent(file));
    if(push!==false && current) history_.push(current);
    current = {graph, file, line, ref};
    $('back').disabled = history_.length===0;
    $('path').textContent = graph+'/'+file + (line?(' :'+line):'');
    renderDoc(d.text, graph, line);
    loadBacklinks(graph, file, ref);
  } catch(e){ $('doc').innerHTML='<div class="empty">doküman açılamadı: '+e+'</div>'; }
}

// --- doküman render (satır satır, tıklanabilir linkler) ---
function renderDoc(text, graph, focusLine){
  const lines = text.split('\n');
  const html = lines.map((raw, idx)=>{
    const no = idx+1;
    if(raw.trim()==='.') return '';
    const ws = (raw.match(/^([ \t]*)/)||['',''])[1];
    const lvl = indentLevel(ws);
    let content = raw.slice(ws.length);
    let cls = 'ln';
    if(content.startsWith('- ')){ content = content.slice(2); }
    const heading = content.match(/^(#{1,6})\s+/);
    if(heading){ cls += ' h'+Math.min(heading[1].length,3); content = content.replace(/^#{1,6}\s+/,''); }
    else if(content.match(/^([A-Za-z][\w-]*):: /)){ cls += ' prop'; }
    else if(raw.trimStart().startsWith('- ')){ cls += ' bullet'; }
    if(no===focusLine) cls += ' focus';
    const rendered = linkify(esc(content), graph) || '&nbsp;';
    return `<div class="${cls}" data-line="${no}" style="margin-left:${lvl*1.4}em">${rendered}</div>`;
  }).join('');
  $('doc').innerHTML = html || '<div class="empty">boş doküman</div>';
  if(focusLine){ const el=$('doc').querySelector(`[data-line="${focusLine}"]`);
    if(el) el.scrollIntoView({block:'center'}); }
}

// ((uuid)) ve [[page]] -> tıklanabilir
function linkify(s, graph){
  s = s.replace(/\(\(([0-9a-fA-F-]{36})\)\)/g,
    (m,u)=>`<a class="ref block" onclick="goBlock('${u}')">↗ ref</a>`);
  s = s.replace(/\[\[([^\]]+)\]\]/g,
    (m,p)=>`<a class="ref page" onclick="goPage('${graph}','${p.replace(/'/g,"\\'")}')">[[${esc(p)}]]</a>`);
  return s;
}

// forward: blok referansına git
async function goBlock(uuid){
  try { const t = await jget('/resolve/block/'+encodeURIComponent(uuid));
    openDoc(t.graph, t.file, t.line, uuid);
  } catch(e){ alert('Bu referans çözümlenemedi (dangling olabilir): '+uuid); }
}
// forward: wikilink sayfasına git
async function goPage(graph, page){
  try { const t = await jget('/resolve/page?key='+encodeURIComponent(graph+'/'+page));
    openDoc(t.graph, t.file, null, null);
  } catch(e){ alert('Sayfa bulunamadı: '+page); }
}

// --- backlink paneli (backward) ---
async function loadBacklinks(graph, file, ref){
  const pageKey = pageKeyFromFile(graph, file);
  let items = [];
  try {
    if(ref){ const d = await jget('/backlinks/'+encodeURIComponent(ref));
      items = d.backlinks.map(b=>({...b, _src:'blok'})); }
    const pd = await jget('/page/backlinks?key='+encodeURIComponent(pageKey));
    const seen = new Set(items.map(b=>b.source_file+':'+b.line));
    for(const b of pd.backlinks){ const k=b.source_file+':'+b.line;
      if(!seen.has(k)){ items.push({...b,_src:'sayfa'}); seen.add(k); } }
  } catch(e){}
  const box = $('backlinks');
  if(!items.length){ box.style.display='none'; return; }
  box.style.display='block'; box.innerHTML = '';
  const head = document.createElement('div'); head.className='bl-head';
  head.textContent = `↩ Bu ${ref?'bloğa/sayfaya':'sayfaya'} gelen ${items.length} backlink — tıkla, kaynağa git`;
  box.appendChild(head);
  for(const b of items){
    const el = document.createElement('div'); el.className='bl';
    el.innerHTML = `<span class="badge ${b.kind}">${b.kind}</span>${esc(b.text)||'<i>(boş)</i>'}
      <div class="m">${esc(b.source_graph)}/${esc(b.source_file)}:${b.line}${b.resolved===false?' · dangling':''}</div>`;
    const srcRef = /^[0-9a-fA-F-]{36}$/.test(b.source_bbl_id||'') ? b.source_bbl_id : null;
    el.addEventListener('click', ()=>openDoc(b.source_graph, b.source_file, b.line, srcRef));
    box.appendChild(el);
  }
}

function goBack(){ const p = history_.pop(); if(!p) return;
  $('back').disabled = history_.length===0;
  openDoc(p.graph, p.file, p.line, p.ref, false); }

$('q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
jget('/stats').then(s=>{ $('stat').textContent = `${s.blocks.toLocaleString()} blok · ${s.edges.toLocaleString()} link`; }).catch(()=>{});
</script>
</body>
</html>
